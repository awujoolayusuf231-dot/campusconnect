<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Your CampusConnect sign-in link</title>
  </head>
  <body style="margin:0;background:#f7f5f4;color:#241f20;font-family:Arial,Helvetica,sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f7f5f4;padding:32px 12px">
      <tr><td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#fff;border:1px solid #e8e1df;border-radius:20px;overflow:hidden">
          <tr><td style="height:6px;background:#c52b3a;font-size:0">&nbsp;</td></tr>
          <tr><td style="padding:32px 28px">
            <p style="margin:0 0 28px;color:#241f20;font-size:18px;font-weight:700">Campus<span style="color:#c52b3a">Connect</span></p>
            <h1 style="margin:0 0 12px;font-size:24px;line-height:1.3">Sign in to CampusConnect</h1>
            <p style="margin:0 0 24px;color:#625b5d;font-size:15px;line-height:1.7">Use this one-time link to securely sign in. It expires shortly and can only be used once.</p>
            <p style="margin:0 0 28px"><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#c52b3a;border-radius:10px;color:#fff;font-size:14px;font-weight:700;padding:13px 20px;text-decoration:none">Sign in</a></p>
            <p style="margin:0;color:#756e70;font-size:12px;line-height:1.6">If you didn’t request this link, ignore this email.</p>
          </td></tr>
          <tr><td style="border-top:1px solid #eee8e6;padding:18px 28px;color:#756e70;font-size:12px;line-height:1.6">CampusConnect · Your campus community, connected.</td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
